name: Validate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 5.x requires Python >=3.10. 3.14 waits until the lockfile's pydantic-core ships 3.14 wheels.
        python-version: [ '3.10', '3.11', '3.13' ]
    name: Python ${{ matrix.python-version }}
    timeout-minutes: 10
    env:
      SHIPPO_TOKEN: ${{ secrets.SHIPPO_TOKEN }}
    concurrency:
      group: python-sdk-check-${{ github.event.pull_request.number }}-${{ matrix.python-version }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.0.0
      - name: cache dependencies
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: python-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: |
          make install
      - name: Check
        run: make check
      - name: Test Reports
        if: always()
        uses: xportation/junit-coverage-report@main
        with:
          junit-path: build/test_results/report.xml
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            build/test_results
